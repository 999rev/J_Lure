<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>castwindow · 南宁路亚窗口与标点助手</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #f4f1ec;
      color: #353a36;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    #lureMap { height: 330px; width: 100%; border-radius: 14px; z-index: 1; }
  </style>
</head>
<body class="min-h-screen pb-8">
  <div class="max-w-xl mx-auto px-4 pt-3.5 space-y-3">
    <!-- Compact Header -->
    <header class="flex items-center justify-between gap-2">
      <div>
        <h1 class="text-lg font-bold tracking-tight text-[#2f3531] flex items-center gap-1.5">
          <span>🎣</span>
          <span>J_Lure</span>
        </h1>
        <p id="coordSubtitle" class="text-[11px] text-[#6e736e]">南宁 · 邕江市区 (22.8170, 108.3665)</p>
      </div>
      <div class="flex items-center gap-1.5">
        <span id="statusBadge" class="text-[11px] px-2.5 py-1 rounded-full bg-[#e6ece8] text-[#496356] border border-[#cad6ce] font-medium">
          准备就绪
        </span>
        <button id="settingsToggleBtn" type="button" aria-label="设置坐标与节点"
          class="min-h-[32px] px-2.5 py-1 rounded-full bg-[#fcfbf9] hover:bg-[#e9e4dc] text-xs border border-[#ddd6cb] text-[#525853] transition">
          ⚙️
        </button>
      </div>
    </header>

    <!-- Toast Banner -->
    <div id="toastBanner" class="hidden rounded-xl px-3.5 py-2 text-xs border"></div>

    <!-- Collapsible Settings Drawer (Hidden by default) -->
    <section id="settingsDrawer" class="hidden bg-[#fcfbf9] border border-[#e3ddd3] rounded-2xl p-3.5 space-y-2.5 shadow-sm">
      <div class="text-xs font-semibold text-[#2f3531]">坐标与转发节点设置</div>
      <div class="flex items-center gap-1.5">
        <input id="workerUrlInput" type="url" placeholder="填入 Cloudflare Worker 网址（如 https://xxx.workers.dev）"
          class="flex-1 min-h-[36px] px-2.5 rounded-xl bg-[#f4f1ec] border border-[#ddd6cb] text-xs text-[#2f3531] focus:outline-none focus:border-[#6c8478]" />
        <button id="saveWorkerBtn" type="button"
          class="shrink-0 min-h-[36px] px-3 rounded-xl bg-[#6c8478] hover:bg-[#5b7266] text-xs font-semibold text-white transition">
          保存节点
        </button>
      </div>
      <div class="grid grid-cols-5 gap-2">
        <div class="col-span-2">
          <label for="latInput" class="block text-[10px] text-[#6e736e] mb-0.5">纬度 (Lat)</label>
          <input id="latInput" type="number" step="0.0001" value="22.8170"
            class="w-full min-h-[36px] px-2.5 rounded-xl bg-[#f4f1ec] border border-[#ddd6cb] text-xs text-[#2f3531] focus:outline-none focus:border-[#6c8478]" />
        </div>
        <div class="col-span-2">
          <label for="lonInput" class="block text-[10px] text-[#6e736e] mb-0.5">经度 (Lon)</label>
          <input id="lonInput" type="number" step="0.0001" value="108.3665"
            class="w-full min-h-[36px] px-2.5 rounded-xl bg-[#f4f1ec] border border-[#ddd6cb] text-xs text-[#2f3531] focus:outline-none focus:border-[#6c8478]" />
        </div>
        <div class="col-span-1 flex items-end">
          <button id="fetchBtn" type="button"
            class="w-full min-h-[36px] rounded-xl bg-[#e9e4dc] hover:bg-[#ded7cc] text-xs font-semibold text-[#353a36] border border-[#d6cec1] transition">
            刷新
          </button>
        </div>
      </div>
    </section>

    <!-- Quick Spots + GPS + Species Strip -->
    <section class="space-y-2">
      <div class="flex items-center gap-1.5">
        <button id="gpsBtn" type="button"
          class="shrink-0 min-h-[34px] px-3 rounded-xl bg-[#6c8478] hover:bg-[#5b7266] active:scale-[0.98] text-white font-semibold text-xs transition flex items-center gap-1 shadow-sm">
          <span>📍</span>
          <span>定位</span>
        </button>
        <div id="presetSpots" class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
      </div>
      <div id="speciesTabs" class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5"></div>
    </section>

    <!-- Main 2-Tab Switcher -->
    <nav class="grid grid-cols-2 gap-1.5 bg-[#e9e4dc] p-1 rounded-2xl border border-[#ddd6cb]">
      <button id="tabBtnForecast" type="button"
        class="min-h-[38px] rounded-xl text-xs font-semibold transition bg-[#fcfbf9] text-[#2f3531] shadow-sm">
        ⏱️ 窗口与手法
      </button>
      <button id="tabBtnMap" type="button"
        class="min-h-[38px] rounded-xl text-xs font-semibold transition text-[#6e736e] hover:text-[#2f3531]">
        🗺️ 地图找标点
      </button>
    </nav>

    <!-- TAB 1: Forecast & Tactic -->
    <main id="panelForecast" class="space-y-3">
      <!-- 48h Score Chart Card -->
      <section class="bg-[#fcfbf9] border border-[#e3ddd3] rounded-2xl p-3.5 shadow-sm">
        <div class="flex items-center justify-between mb-1.5">
          <div class="text-xs font-semibold text-[#2f3531]">
            48h 窗口评分 · 最佳 <span id="bestWindowLabel" class="text-[#4e705e]">--</span>
          </div>
          <span class="text-[10px] text-[#6e736e]">绿≥75 · 蓝≥55 · 橙&lt;55</span>
        </div>
        <div id="barsContainer" class="flex items-end gap-1.5 h-32 overflow-x-auto no-scrollbar pt-3 pb-1"></div>
      </section>

      <!-- Recommended Best Species for Selected Time & Location -->
      <section class="bg-[#fcfbf9] border border-[#e3ddd3] rounded-2xl p-3 space-y-2 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-[#2f3531]">🏆 当前时段 &amp; 位置最佳作钓鱼种</span>
          <span id="recBasisLabel" class="text-[10px] text-[#6e736e]">综合气象 + 水域特征</span>
        </div>
        <div id="recommendedSpeciesRow" class="grid grid-cols-3 gap-1.5"></div>
      </section>

      <!-- Unified Strategy Card -->
      <section class="bg-[#fcfbf9] border border-[#e3ddd3] rounded-2xl p-4 space-y-3 shadow-sm">
        <div class="flex items-center justify-between gap-2">
          <div>
            <div class="text-[11px] text-[#6e736e]">选中时段策略</div>
            <div id="detailTitle" class="text-base font-bold text-[#2f3531] mt-0.5">--</div>
          </div>
          <span id="detailActivity" class="text-xs px-2.5 py-1 rounded-full font-medium bg-[#e6ece8] text-[#496356] border border-[#cad6ce] shrink-0">
            --
          </span>
        </div>

        <!-- Compact Weather Strip -->
        <div id="weatherStrip" class="flex flex-wrap gap-1.5 text-[11px]"></div>

        <!-- Actionable Tactic -->
        <div class="space-y-2 pt-2 border-t border-[#ebe6dd] text-xs">
          <div>
            <span class="text-[#6e736e]">目标水层：</span>
            <span id="tacticLayer" class="text-[#2f3531] font-medium">--</span>
          </div>
          <div>
            <span class="text-[#6e736e]">重点结构：</span>
            <span id="tacticStructure" class="text-[#2f3531] font-medium">--</span>
          </div>
          <div>
            <div class="text-[#6e736e] mb-1">推荐拟饵：</div>
            <div id="tacticLures" class="flex flex-wrap gap-1.5"></div>
          </div>
          <div class="bg-[#f4f1ec] border border-[#e3ddd3] rounded-xl p-2.5">
            <div class="text-[#6e736e] mb-0.5">操竿手法：</div>
            <div id="tacticTechnique" class="text-[#2f3531] leading-relaxed">--</div>
          </div>
        </div>

        <!-- Collapsible Habitat & Score Reasons -->
        <details class="pt-1 border-t border-[#ebe6dd] text-xs">
          <summary class="cursor-pointer text-[#5b7266] font-medium select-none py-1">
            查看鱼种习性与评分依据
          </summary>
          <div class="mt-2 space-y-2 text-[#525853]">
            <div><span class="font-semibold text-[#2f3531]">常驻水层：</span><span id="speciesLayer">--</span></div>
            <div><span class="font-semibold text-[#2f3531]">栖息偏好：</span><span id="speciesHabitat">--</span></div>
            <ul id="detailReasons" class="space-y-1 list-disc pl-4 pt-1"></ul>
          </div>
        </details>
      </section>
    </main>

    <!-- TAB 2: Interactive Map & Hotspots -->
    <main id="panelMap" class="hidden space-y-3">
      <section class="bg-[#fcfbf9] border border-[#e3ddd3] rounded-2xl p-3.5 space-y-2.5 shadow-sm">
        <div class="flex items-center justify-between gap-2">
          <span id="mapLinkBanner" class="text-[11px] font-medium text-[#496356]">
            已联动当前时段风向与目标鱼种
          </span>
          <div class="flex items-center gap-1.5">
            <button id="basemapToggleBtn" type="button"

            </button>

            </button>
          </div>
        </div>

        <div id="lureMap" class="border border-[#ddd6cb]"></div>

        <div class="flex items-center justify-between text-[11px] text-[#6e736e]">
          <span id="hotspotStatus">点击地图任意水面自动分析周边 1.2km 结构</span>
          <span>范围 1.2km</span>
        </div>

        <div id="hotspotList" class="space-y-2"></div>
      </section>
    </main>
  </div>

    // --- WGS84 to GCJ-02 (Amap) accurate conversion ---
    function outOfChina(lat, lon) {
      return lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271;
    }

    function transformLat(x, y) {
      let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      ret += ((20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0) / 3.0;
      ret += ((20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin((y / 3.0) * Math.PI)) * 2.0) / 3.0;
      ret += ((160.0 * Math.sin((y / 12.0) * Math.PI) + 320 * Math.sin((y * Math.PI) / 30.0)) * 2.0) / 3.0;
      return ret;
    }

    function transformLon(x, y) {
      let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      ret += ((20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0) / 3.0;
      ret += ((20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin((x / 3.0) * Math.PI)) * 2.0) / 3.0;
      ret += ((150.0 * Math.sin((x / 12.0) * Math.PI) + 300.0 * Math.sin((x / 30.0) * Math.PI)) * 2.0) / 3.0;
      return ret;
    }

    function wgs84ToGcj02(lat, lon) {
      if (outOfChina(lat, lon)) return [lat, lon];
      const a = 6378245.0;
      const ee = 0.00669342162296594323;
      let dLat = transformLat(lon - 105.0, lat - 35.0);
      let dLon = transformLon(lon - 105.0, lat - 35.0);
      const radLat = (lat / 180.0) * Math.PI;
      let magic = Math.sin(radLat);
      magic = 1 - ee * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / (((a * (1 - ee)) / (magic * sqrtMagic)) * Math.PI);
      dLon = (dLon * 180.0) / ((a / sqrtMagic) * Math.cos(radLat) * Math.PI);
      return [lat + dLat, lon + dLon];
    }

    function buildAmapUrl(lat, lon, label) {
      const [gLat, gLon] = wgs84ToGcj02(lat, lon);
      return `https://uri.amap.com/marker?position=${gLon.toFixed(6)},${gLat.toFixed(6)}&name=${encodeURIComponent(label)}&coordinate=gaode&callnative=1`;
    }

    function haversineM(lat1, lon1, lat2, lon2) {
      const r = 6371000;
      const toRad = (d) => (d * Math.PI) / 180;
      const dp = toRad(lat2 - lat1);
      const dl = toRad(lon2 - lon1);
      const a = Math.sin(dp / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dl / 2) ** 2;
      return 2 * r * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function segIntersect(p1, p2, q1, q2) {
      const [x1, y1] = p1, [x2, y2] = p2, [x3, y3] = q1, [x4, y4] = q2;
      const denom = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
      if (Math.abs(denom) < 1e-12) return null;
      const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / denom;
      const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / denom;
      if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
        return [x1 + t * (x2 - x1), y1 + t * (y2 - y1)];
      }
      return null;
    }

    function turningDeg(a, b, c) {
      const v1x = b[1] - a[1], v1y = b[0] - a[0];
      const v2x = c[1] - b[1], v2y = c[0] - b[0];
      const n1 = Math.hypot(v1x, v1y), n2 = Math.hypot(v2x, v2y);
      if (n1 < 1e-9 || n2 < 1e-9) return 0;
      const cosVal = Math.max(-1, Math.min(1, (v1x * v2x + v1y * v2y) / (n1 * n2)));
      return (Math.acos(cosVal) * 180) / Math.PI;
    }

    function windBonus(segA, segB, windSpeed, windDir) {
      const rad = (windDir * Math.PI) / 180;
      const wx = Math.sin(rad), wy = Math.cos(rad);
      const dx = segB[1] - segA[1], dy = segB[0] - segA[0];
      const norm = Math.hypot(dx, dy);
      if (norm < 1e-9) return [4, "风向中性"];
      const nx = -dy / norm, ny = dx / norm;
      const align = Math.abs(nx * wx + ny * wy);
      if (windSpeed <= 15 && align >= 0.55) return [12, `微风(${windSpeed.toFixed(1)}km/h)吹岸增氧`];
      if (windSpeed > 18 && align < 0.4) return [10, `大风(${windSpeed.toFixed(1)}km/h)背风易抛投`];
      return [4, `常规风向(${windSpeed.toFixed(1)}km/h)`];
    }

    function speciesBiasScore(kind, bias) {

        if (kind === "河道急弯") return 8;
        return 0;
      }
      return 0;
    }

    async function analyzeNearbyHotspots(lat, lon) {
      const sp = SPECIES_DB[currentSpeciesKey];
      const curItem = scoredHours[selectedIndex];
      const windSpeed = curItem ? curItem.wind : 8.0;
      const windDir = curItem ? (curItem.windDir || 120) : 120;
      const timeLabel = curItem ? curItem.label : "当前时段";
      mapLinkBanner.textContent = `已联动：${timeLabel} · ${sp.name} · 风速 ${windSpeed.toFixed(1)}km/h`;
      hotspotStatus.textContent = "正在分析周边 1.2km 河道地形...";

      const query = `[out:json][timeout:30];(way["waterway"~"river|stream|canal"](around:1200,${lat},${lon});way["bridge"="yes"]["highway"~"motorway|trunk|primary|secondary|tertiary"](around:1200,${lat},${lon});node["waterway"~"weir|dam"](around:1200,${lat},${lon}););out geom;`;

      const workerBase = getWorkerUrl();
      const endpoints = [];
      if (workerBase) {
        endpoints.push(`${workerBase}/?target=overpass`);
      } else {
        endpoints.push("/api/weather?target=overpass");
      }
      endpoints.push(
        "https://overpass-api.de/api/interpreter",
        "https://overpass.kumi.systems/api/interpreter",
        "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
      );

      try {
        let data = null;
        let lastErr = null;
        for (const ep of endpoints) {
          try {
            const resp = await fetch(ep, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded", "Accept": "application/json" },
              body: "data=" + encodeURIComponent(query)
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            data = await resp.json();
            break;
          } catch (e) {
            lastErr = e;
          }
        }
        if (!data) throw lastErr || new Error("All endpoints failed");

        lastHotspotFetchCoord = `${lat.toFixed(4)},${lon.toFixed(4)}:${currentSpeciesKey}:${selectedIndex}`;
        const waterways = [], bridges = [], weirs = [];
        const nodes = {};

        (data.elements || []).forEach((el) => {
          if (el.type === "node") {
            nodes[el.id] = [el.lat, el.lon];
            if (el.tags && (el.tags.waterway === "weir" || el.tags.waterway === "dam")) weirs.push(el);
          } else if (el.type === "way") {
            const geom = el.geometry || [];
            const nids = el.nodes || [];
            nids.forEach((nid, i) => { if (geom[i]) nodes[nid] = [geom[i].lat, geom[i].lon]; });
            if (el.tags && el.tags.waterway) waterways.push(el);
            if (el.tags && el.tags.bridge === "yes") bridges.push(el);
          }
        });

        const spots = [];
        const nodeWays = {};
        waterways.forEach((w) => {
          const wName = (w.tags && (w.tags.name || w.tags.waterway)) || "河道";
          new Set(w.nodes || []).forEach((nid) => {
            if (!nodeWays[nid]) nodeWays[nid] = [];
            nodeWays[nid].push(wName);
          });
        });

        Object.entries(nodeWays).forEach(([nid, names]) => {
          if (names.length >= 2 && nodes[nid]) {
            const bias = speciesBiasScore("支流交汇口", sp.spot_bias);
            spots.push({
              kind: "支流交汇口",
              lat: nodes[nid][0],
              lon: nodes[nid][1],
              score: Math.min(99, 82 + bias),
              reason: `水系交汇 (${[...new Set(names)].join(" + ")})，溶氧与饵鱼密集`
            });
          }
        });

        weirs.forEach((wn) => {
          const bias = speciesBiasScore("拦水坝/闸口", sp.spot_bias);
          spots.push({
            kind: "拦水坝/闸口",
            lat: wn.lat,
            lon: wn.lon,
            score: Math.min(99, 80 + bias),
            reason: "跌水洄流区，溶氧高且下泄饵鱼集中"
          });
        });

        bridges.forEach((b) => {
          const bPts = (b.nodes || []).map((id) => nodes[id]).filter(Boolean);
          const bName = (b.tags && b.tags.name) || "跨河桥梁";
          waterways.forEach((w) => {
            const wPts = (w.nodes || []).map((id) => nodes[id]).filter(Boolean);
            for (let i = 0; i < bPts.length - 1; i++) {
              for (let j = 0; j < wPts.length - 1; j++) {
                const hit = segIntersect(bPts[i], bPts[i + 1], wPts[j], wPts[j + 1]);
                if (hit) {
                  const [wb, wNote] = windBonus(wPts[j], wPts[j + 1], windSpeed, windDir);
                  const bias = speciesBiasScore("桥梁跨河结构", sp.spot_bias);
                  spots.push({
                    kind: "桥梁跨河结构",
                    lat: hit[0],
                    lon: hit[1],
                    score: Math.min(99, 68 + wb + bias),
                    reason: `${bName} 桥墩阴影与洄水；${wNote}`
                  });
                }
              }
            }
          });
        });

        waterways.forEach((w) => {
          const wPts = (w.nodes || []).map((id) => nodes[id]).filter(Boolean);
          const wName = (w.tags && w.tags.name) || "河道";
          for (let i = 1; i < wPts.length - 1; i++) {
            const ang = turningDeg(wPts[i - 1], wPts[i], wPts[i + 1]);
            if (ang >= 30) {
              const [wb, wNote] = windBonus(wPts[i - 1], wPts[i + 1], windSpeed, windDir);
              const bias = speciesBiasScore("河道急弯", sp.spot_bias);
              spots.push({
                kind: "河道急弯",
                lat: wPts[i][0],
                lon: wPts[i][1],
                score: Math.min(99, 62 + wb + bias + Math.min(8, Math.floor(ang / 12))),
                reason: `${wName} ${ang.toFixed(0)}° 弯道深槽/缓水区；${wNote}`
              });
            }
          }
        });

        const deduped = [];
        spots.sort((a, b) => b.score - a.score).forEach((s) => {
          if (deduped.every((d) => haversineM(s.lat, s.lon, d.lat, d.lon) > 80)) {
            deduped.push(s);
          }
        });

        terrainSignals = {
          hasStream: waterways.some((w) => w.tags && w.tags.waterway === "stream"),
          hasRiver: waterways.some((w) => w.tags && w.tags.waterway === "river"),
          hasBridge: bridges.length > 0,
          hasWeir: weirs.length > 0
        };
        const top = deduped.slice(0, 6);
        renderHotspots(top);
        renderRecommendedSpecies();
        hotspotStatus.textContent = `已按 ${sp.name} 习性排序，共 ${top.length} 个候选标点`;
      } catch (err) {
        hotspotStatus.textContent = "地形接口暂时繁忙，可点击 ⚙️ 填入 Worker 节点或切卫星图查看";
        renderHotspots([]);
      }
    }

    function scorePressure(p, delta3h) {
      if (delta3h >= 0.8 && delta3h <= 3.0) return [28, `3h 气压稳步回升 (+${delta3h.toFixed(1)} hPa)，开口窗口极佳`];
      if (delta3h >= -2.2 && delta3h <= -0.6) return [22, `3h 气压小幅缓降 (${delta3h.toFixed(1)} hPa)，阴天前常有抢食窗口`];
      if (delta3h < -2.5) return [8, `3h 气压骤降 (${delta3h.toFixed(1)} hPa)，鱼群易闷底停口`];
      if (p < 998) return [10, `气压偏低 (${p.toFixed(0)} hPa)，溶氧偏低建议搜深水`];
      if (p >= 1005) return [18, `气压平稳 (${p.toFixed(0)} hPa)，无明显涨跌刺激`];
      return [15, `气压常规 (${p.toFixed(0)} hPa)`];
    }

    function scoreWind(wind, tolerance) {
      if (wind >= 5 && wind <= 13) return [22, `微风 (${wind.toFixed(1)} km/h) 利于水表增氧且方便抛投`];
      if (wind < 5) return [13, `静水/微弱风 (${wind.toFixed(1)} km/h)，水清鱼警觉建议细线轻饵`];
      if (wind <= tolerance) return [12, `风力偏大 (${wind.toFixed(1)} km/h)，优先用重克重远投饵`];
      return [4, `大风 (${wind.toFixed(1)} km/h) 严重影响抛投精度与控线`];
    }

    function scoreTemp(temp, tMin, tMax) {
      if (temp >= tMin + 2 && temp <= tMax - 2) return [20, `气温 ${temp.toFixed(1)}°C 处于最适核心区间`];
      if (temp >= tMin && temp <= tMax) return [15, `气温 ${temp.toFixed(1)}°C 处于 ${tMin}–${tMax}°C 适口区间`];
      const diff = Math.min(Math.abs(temp - tMin), Math.abs(temp - tMax));
      if (diff <= 4) return [9, `气温 ${temp.toFixed(1)}°C 略偏离适口区`];
      return [3, `气温 ${temp.toFixed(1)}°C 偏离适口区较大，鱼活性偏低`];
    }

    function scoreLightAndHour(hour, cloud) {
      const isPrime = (hour >= 5 && hour <= 8) || (hour >= 17 && hour <= 20);
      const isOvercast = cloud >= 65;
      if (isPrime) return [20, `${String(hour).padStart(2, "0")}:00 处于晨昏黄金窗口期`, true];
      if (isOvercast) return [16, `云量 ${cloud.toFixed(0)}% 光线柔和，中上层仍有巡游可能`, true];
      if (hour >= 11 && hour <= 15 && cloud < 40) return [3, "正午强光直射，鱼群多压底或躲入障碍阴影区", false];
      return [9, "常规光照过渡时段", false];
    }

    function scoreRain(rain) {
      if (rain >= 20 && rain <= 45) return [10, `降水概率 ${rain.toFixed(0)}%（微雨预期），溶氧高窗口佳`];
      if (rain < 20) return [6, "晴干无明显降水增氧"];
      if (rain <= 70) return [4, `降水概率 ${rain.toFixed(0)}%，注意防雨与安全`];
      return [0, `高降水风险 (${rain.toFixed(0)}%)，不建议涉水或空旷作钓`];
    }

    function locationSpeciesBonus(speciesKey, spotName, lat) {
      let bonus = 0;
      const tags = [];
      const name = spotName || "";
      if (name.includes("良凤江") || terrainSignals.hasStream || terrainSignals.hasWeir) {
        if (["马口鱼", "军鱼", "黑鱼", "罗非鱼"].includes(speciesKey)) {
          bonus += 5;
          tags.push("溪流/支流生境契合");
        }
      }
      if (name.includes("大王滩") || lat < 22.68) {
        if (["黑鲈", "鳜鱼", "翘嘴", "太阳鱼"].includes(speciesKey)) {
          bonus += 5;
          tags.push("水库库湾结构契合");
        }
      }
      if (name.includes("邕江") || name.includes("柳江") || name.includes("漓江") || terrainSignals.hasRiver) {
        if (["翘嘴", "鳡鱼", "红眼鳟", "鳜鱼"].includes(speciesKey)) {
          bonus += 4;
          tags.push("大江主河道契合");
        }
      }
      if (terrainSignals.hasBridge && ["鳜鱼", "黑鲈", "红眼鳟"].includes(speciesKey)) {
        bonus += 4;
      }
      return [bonus, tags[0] || "常规水域匹配"];
    }

    function timeHabitBonus(speciesKey, hour, cloud, temp) {
      // 昼伏夜出型（鳜鱼）
      if (speciesKey === "鳜鱼") {
        if (hour >= 18 || hour <= 6 || cloud >= 65) return [7, "弱光/夜间鳜鱼活性上升"];
        if (hour >= 11 && hour <= 15 && cloud < 35) return [-6, "正午强光鳜鱼多躲石缝"];
      }
      // 喜阳暖水型（罗非鱼、黑鱼、军鱼）
      if (["罗非鱼", "黑鱼", "军鱼"].includes(speciesKey)) {
        if (temp >= 22 && hour >= 9 && hour <= 17) return [6, "白天暖水时段活性佳"];
        if (temp < 17) return [-8, "气温偏低活性下降"];
      }
      // 晨昏敞水炸水型（翘嘴、鳡鱼、红眼鳟）
      if (["翘嘴", "鳡鱼", "红眼鳟"].includes(speciesKey)) {
        if ((hour >= 5 && hour <= 8) || (hour >= 17 && hour <= 20)) return [7, "晨昏窗口易上浮追饵"];
      }
      return [0, ""];
    }

    function scoreSingleHourForSpecies(w, delta3h, sp) {
      const [ps] = scorePressure(w.pressure, delta3h);
      const [ws] = scoreWind(w.wind, sp.wind_tolerance_kmh);
      const [ts] = scoreTemp(w.temp, sp.ideal_temp_min, sp.ideal_temp_max);
      const [ls] = scoreLightAndHour(w.hour, w.cloud);
      const [rs] = scoreRain(w.rain);
      return ps + ws + ts + ls + rs;
    }

    function renderRecommendedSpecies() {
      const row = document.getElementById("recommendedSpeciesRow");
      const basisEl = document.getElementById("recBasisLabel");
      if (!row || !scoredHours[selectedIndex]) return;

      const cur = scoredHours[selectedIndex];
      const lat = parseFloat(latInput.value) || 22.8170;
      const ranked = Object.keys(SPECIES_DB).map((key) => {
        const sp = SPECIES_DB[key];
        const baseScore = scoreSingleHourForSpecies(cur, cur.delta3h, sp);
        const [locBonus, locNote] = locationSpeciesBonus(key, currentSpotName, lat);
        const [timeBonus, timeNote] = timeHabitBonus(key, cur.hour, cur.cloud, cur.temp);
        const total = Math.max(0, Math.min(96, baseScore + locBonus + timeBonus));
        return { key, total, note: timeNote || locNote };
      }).sort((a, b) => b.total - a.total).slice(0, 3);

      if (basisEl) basisEl.textContent = `${cur.label} · ${currentSpotName}`;
      row.innerHTML = "";
      ranked.forEach((item, idx) => {
        const isCur = item.key === currentSpeciesKey;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "text-left rounded-xl p-2 border transition " + (
          isCur
            ? "bg-[#e6ece8] border-[#6c8478] ring-1 ring-[#6c8478]"
            : "bg-[#f4f1ec] hover:bg-[#eae4da] border-[#e3ddd3]"
        );
        btn.innerHTML = `
          <div class="flex items-center justify-between text-xs font-bold text-[#2f3531]">
            <span>${idx === 0 ? "🥇" : idx === 1 ? "🥈" : "🥉"} ${item.key}</span>
            <span class="text-[#4e705e]">${item.total}</span>
          </div>
          <div class="text-[10px] text-[#6e736e] mt-0.5 truncate">${item.note}</div>
        `;
        btn.addEventListener("click", () => {
          currentSpeciesKey = item.key;

        });

      });
    }

    function computeScores() {
      const sp = SPECIES_DB[currentSpeciesKey];
      scoredHours = hourlyWeather.map((w, idx) => {
        const prevIdx = Math.max(0, idx - 3);
        const delta3h = w.pressure - hourlyWeather[prevIdx].pressure;
        const [ps, pm] = scorePressure(w.pressure, delta3h);
        const [ws, wm] = scoreWind(w.wind, sp.wind_tolerance_kmh);
        const [ts, tm] = scoreTemp(w.temp, sp.ideal_temp_min, sp.ideal_temp_max);
        const [ls, lm, softLight] = scoreLightAndHour(w.hour, w.cloud);
        const [rs, rm] = scoreRain(w.rain);

        const total = Math.max(0, Math.min(100, ps + ws + ts + ls + rs));
        const tactic = (total >= 70 || softLight) ? sp.high_activity_tactic : sp.low_activity_tactic;

        return {
          ...w,
          delta3h: Number(delta3h.toFixed(1)),
          score: total,
          reasons: [pm, wm, tm, lm, rm],
          tactic
        };
      });

      if (scoredHours.length > 0) {
        let bestIdx = 0;
        scoredHours.forEach((h, i) => {
          if (h.score > scoredHours[bestIdx].score) bestIdx = i;
        });
        selectedIndex = bestIdx;
      }
    }

    function buildSampleWeather() {
      const now = new Date();
      now.setMinutes(0, 0, 0);
      const list = [];
      for (let i = 0; i < 48; i++) {
        const dt = new Date(now.getTime() + i * 3600 * 1000);
        const h = dt.getHours();
        const mm = String(dt.getMonth() + 1).padStart(2, "0");
        const dd = String(dt.getDate()).padStart(2, "0");
        const hh = String(h).padStart(2, "0");
        list.push({
          label: `${mm}-${dd} ${hh}:00`,
          hourLabel: `${hh}h`,
          hour: h,
          temp: 23 + Math.sin((h - 6) * Math.PI / 12) * 4,
          pressure: 1011 + Math.sin(i / 6) * 2.5,
          wind: 7 + Math.abs(Math.cos(i / 4)) * 6,
          windDir: 120,
          cloud: (h >= 11 && h <= 15) ? 25 : 65,
          rain: 20
        });
      }
      return list;
    }

    async function loadWeather() {
      const lat = parseFloat(latInput.value);
      const lon = parseFloat(lonInput.value);
      if (Number.isNaN(lat) || Number.isNaN(lon)) {
        showToast("请输入有效的经纬度数值", "error");
        return;
      }

      saveCoords(lat, lon);
      statusBadge.textContent = "拉取气象中...";
      hideToast();

      const workerBase = getWorkerUrl();
      const url = workerBase
        ? `${workerBase}/?latitude=${lat}&longitude=${lon}`
        : `/api/weather?latitude=${lat}&longitude=${lon}`;

      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        const h = data.hourly;
        const nowFloor = new Date();
        nowFloor.setMinutes(0, 0, 0);
        const nowMs = nowFloor.getTime();
        const futureList = [];
        for (let i = 0; i < h.time.length; i++) {
          const dt = new Date(h.time[i]);
          if (dt.getTime() < nowMs) continue;
          const mm = String(dt.getMonth() + 1).padStart(2, "0");
          const dd = String(dt.getDate()).padStart(2, "0");
          const hh = String(dt.getHours()).padStart(2, "0");
          futureList.push({
            label: `${mm}-${dd} ${hh}:00`,
            hourLabel: `${hh}h`,
            hour: dt.getHours(),
            temp: Number(h.temperature_2m[i]),
            pressure: Number(h.surface_pressure[i]),
            wind: Number(h.wind_speed_10m[i]),
            windDir: Number(h.wind_direction_10m ? h.wind_direction_10m[i] : 120),
            cloud: Number(h.cloud_cover[i]),
            rain: Number(h.precipitation_probability[i])
          });
          if (futureList.length >= 48) break;
        }
        hourlyWeather = futureList;
        statusBadge.textContent = "实时气象";
      } catch (err) {
        hourlyWeather = buildSampleWeather();
        statusBadge.textContent = "示例模式";
        showToast("无法直连气象接口（点右上角 ⚙️ 填入你的 Cloudflare Worker 节点即可直连），当前展示示例数据。", "warn");
      }

      computeScores();
      renderAll();
    }

    gpsBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        showToast("当前浏览器不支持 GPS 定位，请点选常用水系或在地图上选点", "warn");
        return;
      }
      statusBadge.textContent = "定位中...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = Number(pos.coords.latitude.toFixed(4));
          const lon = Number(pos.coords.longitude.toFixed(4));
          currentSpotName = "GPS 当前位置";
          latInput.value = lat;
          lonInput.value = lon;
          updateSubtitle();
          renderPresetSpots();
          updateMapCenter(lat, lon, true);
          showToast(`定位成功: (${lat}, ${lon})`, "info");
          loadWeather();
          if (activeTab === "map") analyzeNearbyHotspots(lat, lon);
        },
        () => {
          statusBadge.textContent = "定位未授权";
          showToast("无法获取定位权限，请点选上方常用水系或切到“地图找标点”直接点水面。", "warn");
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    });

    fetchBtn.addEventListener("click", () => {
      const lat = parseFloat(latInput.value);
      const lon = parseFloat(lonInput.value);
      if (!Number.isNaN(lat) && !Number.isNaN(lon)) {
        currentSpotName = "手动输入坐标";
        updateSubtitle();
        renderPresetSpots();
        updateMapCenter(lat, lon, true);
        loadWeather();
        if (activeTab === "map") analyzeNearbyHotspots(lat, lon);
      }
    });

    analyzeHotspotBtn.addEventListener("click", () => {
      const lat = parseFloat(latInput.value);
      const lon = parseFloat(lonInput.value);
      if (!Number.isNaN(lat) && !Number.isNaN(lon)) {
        analyzeNearbyHotspots(lat, lon);
      }
    });

    // Init
    loadSavedState();
    updateSubtitle();
    initMap();
    renderPresetSpots();
    renderSpeciesTabs();
    loadWeather();
  </script>
</body>
</html>
